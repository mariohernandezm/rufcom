<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1250" role="img" aria-labelledby="title desc">
<title id="title">Plano RUFCOM Flower Pot VHF</title>
<desc id="desc">Plano de referencia con sección superior de 457 mm, sección inferior de 447 mm y choke de 9 vueltas sobre tubo PVC de 25 mm.</desc>
<defs>
  <style>
    .h{font:bold 44px Arial,Helvetica,sans-serif;fill:#211b16}
    .sub{font:bold 24px Arial,Helvetica,sans-serif;fill:#b46f00}
    .tx{font:24px Arial,Helvetica,sans-serif;fill:#5f5549}
    .num{font:bold 28px Arial,Helvetica,sans-serif;fill:#44250a}
    .dim{stroke:#b46f00;stroke-width:4;fill:none}
    .guide{stroke:#8a8177;stroke-width:3}
    .coax{stroke:#3c3c3c;stroke-width:22;fill:none;stroke-linecap:round}
    .inner{stroke:#d89100;stroke-width:10;fill:none;stroke-linecap:round}
  </style>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#b46f00"/>
  </marker>
</defs>

<rect width="900" height="1250" rx="30" fill="#fffaf0"/>
<text x="60" y="72" class="h">FLOWER POT VHF</text>
<text x="60" y="112" class="sub">Plano RUFCOM · simple, económico y probado</text>

<!-- PVC -->
<rect x="390" y="185" width="120" height="760" rx="24" fill="#edf1f1" stroke="#aab3b3" stroke-width="5"/>
<rect x="400" y="155" width="100" height="42" rx="16" fill="#dde4e4" stroke="#aab3b3" stroke-width="4"/>
<text x="545" y="207" class="tx">Tubo PVC Ø 25 mm</text>

<!-- coax -->
<path d="M450 900 L450 530" class="coax"/>
<path d="M450 530 L450 230" class="inner"/>
<text x="545" y="485" class="tx">Coaxial por dentro</text>
<text x="545" y="310" class="tx">Conductor interior</text>

<!-- dimensions -->
<line x1="245" y1="230" x2="245" y2="530" class="dim" marker-start="url(#arr)" marker-end="url(#arr)"/>
<line x1="270" y1="230" x2="365" y2="230" class="guide"/>
<line x1="270" y1="530" x2="365" y2="530" class="guide"/>
<text x="80" y="365" class="num">457 mm</text>
<text x="65" y="401" class="tx">sección superior</text>

<line x1="245" y1="530" x2="245" y2="845" class="dim" marker-start="url(#arr)" marker-end="url(#arr)"/>
<line x1="270" y1="845" x2="365" y2="845" class="guide"/>
<text x="80" y="680" class="num">447 mm</text>
<text x="72" y="716" class="tx">sección inferior</text>

<!-- choke 9 turns -->
<g fill="none" stroke="#3c3c3c" stroke-width="19">
  <ellipse cx="450" cy="855" rx="90" ry="22"/>
  <ellipse cx="450" cy="880" rx="90" ry="22"/>
  <ellipse cx="450" cy="905" rx="90" ry="22"/>
  <ellipse cx="450" cy="930" rx="90" ry="22"/>
  <ellipse cx="450" cy="955" rx="90" ry="22"/>
  <ellipse cx="450" cy="980" rx="90" ry="22"/>
  <ellipse cx="450" cy="1005" rx="90" ry="22"/>
  <ellipse cx="450" cy="1030" rx="90" ry="22"/>
  <ellipse cx="450" cy="1055" rx="90" ry="22"/>
</g>
<text x="585" y="930" class="num">9 vueltas</text>
<text x="585" y="968" class="tx">sobre el mismo</text>
<text x="585" y="1002" class="tx">tubo de 25 mm</text>
<text x="585" y="1036" class="tx">(choke)</text>

<path d="M450 1075 L450 1150" class="coax"/>
<rect x="420" y="1145" width="60" height="50" rx="7" fill="#c7c7c7" stroke="#444" stroke-width="4"/>
<text x="520" y="1180" class="tx">Hacia PL-259 / radio</text>

<rect x="60" y="1095" width="280" height="100" rx="16" fill="#fff0c6" stroke="#edcf82" stroke-width="3"/>
<text x="82" y="1132" class="sub" style="font-size:21px">PVC aproximado</text>
<text x="82" y="1170" class="tx">1 metro de largo</text>

<text x="60" y="1220" class="sub">RUFCOM · Aprobado por Ruffis</text>
</svg>

name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate public files, local links and security policy
        run: python scripts/validate_site.py
      - name: Validate semantic brand roles and shared type scale
        run: python scripts/validate_brand.py
      - name: Validate SEO for every canonical page
        run: python scripts/seo.py --check
      - name: Validate JavaScript syntax
        run: |
          node --check site/assets/js/main.js
          node --check site/assets/js/repetidores.js
          node --check site/assets/js/carousel.js
          node --check scripts/browser_smoke.cjs
      - name: Check carousel, repeater settings and shared searches
        run: node --test tests/*.test.cjs
      - name: Check validation rejects unsafe changes
        run: python -m unittest discover -s tests -v
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/rufcom-browser" --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/rufcom-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check affected pages on desktop and mobile
        env:
          RUFCOM_PLAYWRIGHT_MODULE: ${{ runner.temp }}/rufcom-browser/node_modules/playwright
          RUFCOM_BROWSER_ARTIFACTS: ${{ runner.temp }}/rufcom-browser-review
        run: node scripts/browser_smoke.cjs
      - name: Save browser review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-review
          path: ${{ runner.temp }}/rufcom-browser-review
          if-no-files-found: ignore
          retention-days: 7
